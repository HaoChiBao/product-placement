<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Live detection</title>
<style>
  :root { --bg:#141414; --card:#1f1f1f; --line:#2c2c2c; --ink:#fff; --muted:#a3a3a3; --red:#e50914; --green:#46d369; --amber:#f5a524; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { position:sticky; top:0; z-index:5; background:rgba(20,20,20,.92); backdrop-filter:blur(8px); border-bottom:1px solid var(--line); padding:14px 24px; display:flex; gap:20px; align-items:center; flex-wrap:wrap; }
  header h1 { font-size:17px; margin:0; }
  .meta { color:var(--muted); font-size:12.5px; }
  .phase { margin-left:auto; display:flex; align-items:center; gap:8px; font-weight:600; }
  .dot { width:9px; height:9px; border-radius:50%; background:var(--red); animation:pulse 1s infinite; }
  .phase.done .dot { background:var(--green); animation:none; }
  .phase.stopped .dot { background:var(--amber); animation:none; }
  @keyframes pulse { 50% { opacity:.25; } }
  main { padding:20px 24px 60px; display:flex; flex-direction:column; gap:28px; }
  h2 { font-size:13px; text-transform:uppercase; letter-spacing:.1em; color:var(--muted); margin:0 0 12px; font-weight:600; }
  .grid { display:grid; gap:16px; grid-template-columns:repeat(auto-fill, minmax(380px, 1fr)); }
  .grid.wide { grid-template-columns:repeat(auto-fill, minmax(560px, 1fr)); }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; overflow:hidden; animation:in .35s ease-out; }
  @keyframes in { from { opacity:0; transform:translateY(8px); } }
  .shot { position:relative; line-height:0; background:#000; }
  .shot img { width:100%; display:block; }
  .scan { position:absolute; inset:0; overflow:hidden; }
  .scan::after { content:""; position:absolute; top:0; bottom:0; width:28%; background:linear-gradient(90deg, transparent, rgba(229,9,20,.35), transparent); animation:scan 1.2s linear infinite; }
  @keyframes scan { from { left:-30%; } to { left:100%; } }
  .tile { position:absolute; border:2px solid var(--red); box-shadow:0 0 0 9999px rgba(0,0,0,0); animation:pop .3s ease-out; }
  .tile span, .box span { position:absolute; left:-2px; top:-2px; transform:translateY(-100%); background:var(--red); color:#fff; font:600 10.5px/1 system-ui; padding:3px 5px; border-radius:3px 3px 3px 0; white-space:nowrap; }
  .box { position:absolute; border:2.5px solid var(--green); animation:pop .35s ease-out; }
  .box span { background:var(--green); color:#04210d; }
  .box.rejected { border-color:var(--amber); border-style:dashed; }
  @keyframes pop { from { transform:scale(1.15); opacity:0; } }
  .cap { padding:10px 12px; font-size:12.5px; color:var(--muted); display:flex; flex-direction:column; gap:3px; }
  .cap b { color:var(--ink); font-weight:600; }
  .pill { display:inline-block; font-size:11px; font-weight:600; padding:2px 8px; border-radius:999px; margin-right:6px; }
  .p-pending { background:rgba(229,9,20,.16); color:#ff6b72; }
  .p-done, .p-kept { background:rgba(70,211,105,.15); color:var(--green); }
  .p-rejected { background:rgba(245,165,36,.15); color:var(--amber); }
  .p-failed { background:rgba(255,77,85,.15); color:#ff4d55; }
  .empty { color:var(--muted); }
  .frames { display:grid; grid-template-columns:repeat(4, minmax(0, 1fr)); gap:4px; padding:0 4px; }
  .tc { position:absolute; right:4px; bottom:4px; background:rgba(0,0,0,.7); color:#fff; font:500 10.5px/1 ui-monospace, monospace; padding:3px 5px; border-radius:3px; }
  .p-done { background:rgba(70,211,105,.15); color:var(--green); }
  .final { display:grid; gap:12px; grid-template-columns:repeat(auto-fill, minmax(260px, 1fr)); }
  .final .card .cap b { font-size:13.5px; }
  .error { color:#ff6b72; }
</style>
</head>
<body>
<header>
  <h1 id="title">Live detection</h1>
  <span class="meta" id="meta"></span>
  <span class="phase" id="phase"><span class="dot"></span><span id="phaseText">Starting…</span></span>
</header>
<main>
  <section><h2>1 · Asking the model about keyframes <span id="batchCount"></span></h2>
    <p class="meta" id="prep">Finding shot cuts and pulling about one keyframe per second from each shot…</p>
    <div id="batches" style="display:flex;flex-direction:column;gap:18px"></div></section>
  <section><h2>2 · Moments kept</h2><div class="final" id="final"><p class="empty">Not done yet.</p></div></section>
</main>
<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const pct = (n) => (n * 100).toFixed(2) + "%";
const fmt = (s) => { s = Math.max(0, s || 0); const m = Math.floor(s / 60); return `${String(m).padStart(2, "0")}:${(s % 60).toFixed(1).padStart(4, "0")}`; };
let last = "";
let state = null;

function frameCell(f, objects) {
  const boxes = objects.map((o) => `<div class="box" style="left:${pct(o.box.x)};top:${pct(o.box.y)};width:${pct(o.box.w)};height:${pct(o.box.h)}"><span>${esc(o.label)}${o.swap_with ? ` → ${esc(o.swap_with)}` : ""} · ${Number(o.visibility).toFixed(2)}</span></div>`).join("");
  return `<div class="shot" style="border-radius:6px;overflow:hidden"><img src="${esc(f.image)}" alt="">${boxes}<span class="tc">${f.time != null ? fmt(f.time) : ""}</span></div>`;
}

function batchCard(b) {
  const objs = b.objects || [];
  const status = b.status === "pending" ? "Asking…" : b.status === "failed" ? "Model call failed" : `${objs.length} objects found`;
  const cells = b.frames.map((f, i) => frameCell(f, objs.filter((o) => o.frame === i))).join("");
  const list = objs.slice().sort((a, c) => c.visibility - a.visibility).slice(0, 6)
    .map((o) => `<span><b>${esc(o.label)}</b> (${esc(o.category)}) → swap with ${esc(o.swap_with || "?")} · visibility ${Number(o.visibility).toFixed(2)} · ${fmt(b.frames[o.frame]?.time)}</span>`).join("");
  return `<div class="card"><div class="cap"><span><span class="pill p-${b.status}">${esc(status)}</span>Batch ${b.index} · ${b.frames.length} frames${b.seconds ? ` · ${b.seconds}s` : ""}</span></div>
    <div class="frames" style="position:relative">${cells}${b.status === "pending" ? '<div class="scan"></div>' : ""}</div>
    ${list ? `<div class="cap">${list}</div>` : ""}</div>`;
}

function finalCard(m) {
  const r = m.region, w = m.frame_w || 1, h = m.frame_h || 1;
  return `<div class="card"><div class="shot"><img src="${esc(m.frame.split(/[\\/]/).slice(-2).join("/"))}" alt="">
    <div class="box" style="left:${pct(r.x / w)};top:${pct(r.y / h)};width:${pct(r.w / w)};height:${pct(r.h / h)}"><span>${esc(m.whats_there)}</span></div></div>
    <div class="cap"><b>${fmt(m.start_s)} – ${fmt(m.end_s)}</b><span>${esc(m.whats_there)} · ${Number(m.score).toFixed(2)}</span><span>${esc(m.reason)}</span></div></div>`;
}

async function tick() {
  try {
    const res = await fetch("events.json?t=" + Date.now(), { cache: "no-store" });
    const text = await res.text();
    if (text !== last) {
      last = text;
      const s = (state = JSON.parse(text));
      document.title = `${s.phase} · ${s.clip}`;
      $("title").textContent = s.clip;
      $("meta").textContent = `${s.brand ? `for ${s.brand} · ` : ""}${s.model} · ${fmt(s.duration)} long`;
      $("phase").className = "phase" + (s.phase === "Done" ? " done" : s.phase === "Stopped" ? " stopped" : "");
      const prep = [s.shots != null ? `${s.shots} shots` : null, s.keyframes != null ? `${s.keyframes} keyframes` : null].filter(Boolean).join(" · ");
      $("prep").textContent = prep ? `${prep}, sent to the model 8 at a time.` : "Finding shot cuts and pulling about one keyframe per second from each shot…";
      if (s.batches.length) $("batches").innerHTML = s.batches.map(batchCard).join("");
      const done = s.batches.filter((b) => b.status !== "pending").length;
      $("batchCount").textContent = s.batches.length ? `(${done} of ${s.batches.length} answered)` : "";
      if (s.moments) $("final").innerHTML = s.moments.length ? s.moments.map(finalCard).join("") : '<p class="empty">No moments kept.</p>';
      if (s.error) $("final").innerHTML = `<p class="error">${esc(s.error)}</p>`;
    }
  } catch (err) { /* server not ready yet */ }
  if (state) {
    const elapsed = ((state.finished || Date.now() / 1000) - state.started).toFixed(0);
    $("phaseText").textContent = `${state.phase} · ${elapsed}s`;
  }
  setTimeout(tick, 700);
}
tick();
</script>
</body>
</html>
