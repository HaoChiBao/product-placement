[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "product-placement"
version = "0.1.0"
description = "Milestone 1: detect, track, and composite a product into a video clip"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy==1.26.4",
  "opencv-python-headless==4.10.0.84",
  "Pillow==11.0.0",
  "torch==2.5.1",
  "torchvision==0.20.1",
  "transformers==4.46.3",
  "accelerate==1.1.1",
  "timm==1.0.11",
  "huggingface-hub==0.26.2",
  "tqdm==4.67.1",
  "matplotlib==3.9.2",
  "hydra-core==1.3.8",
  "omegaconf==2.3.1",
  "iopath==0.1.10",
]

[project.optional-dependencies]
dev = ["pytest==8.3.3"]

[project.scripts]
product-placement = "product_placement.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
