[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "product-placement"
version = "0.3.0"
description = "Suggest placement moments and swap products via pluggable video-edit backends"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "httpx==0.27.2",
]

[project.optional-dependencies]
dev = ["pytest==8.3.3"]
suggest = [
  "numpy==1.26.4",
  "opencv-python-headless==4.10.0.84",
]
eval = [
  "numpy==1.26.4",
  "opencv-python-headless==4.10.0.84",
  "torch==2.5.1",
  "torchvision==0.20.1",
  "transformers==4.46.3",
  "accelerate==1.1.1",
  "timm==1.0.11",
  "huggingface-hub==0.26.2",
]

[project.scripts]
product-placement = "product_placement.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
